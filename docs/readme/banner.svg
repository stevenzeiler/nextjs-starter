<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">nextjs-starter</title>
  <desc id="d">A Next.js starter that shows a single centred ZenLens logo on a blank page.</desc>
  <style>
    .ring { transform-origin: 950px 150px; animation: breathe 10s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.12); opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#334155" stroke-width="2"/>
  <g fill="none" stroke="#e2e8f0">
    <circle class="ring" cx="950" cy="150" r="96" stroke-width="2"/>
    <circle cx="950" cy="150" r="64" stroke-width="2" opacity=".7"/>
    <circle cx="950" cy="150" r="30" stroke-width="2" opacity=".9"/>
  </g>
  <circle cx="950" cy="150" r="8" fill="#f8fafc"/>
  <text x="70" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="64" font-weight="700" fill="#f8fafc">nextjs-starter</text>
  <text x="72" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" fill="#cbd5e1">One blank page. One centred logo. Nothing else.</text>
  <text x="72" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#94a3b8">Next.js 16 · React 19 · Tailwind 4 · TypeScript</text>
</svg>
